prefixes:
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  sio: http://semanticscience.org/resource/
  dcterms: http://purl.org/dc/terms/
  foaf: http://xmlns.com/foaf/0.1/
  orcid: https://orcid.org/
  ror: https://ror.org/
  this: http://w3id.org/project/data/
  cbgp: http://w3id.org/ontology#
  mail: http://www.w3.org/2006/vcard/ns#
  bfo: http://purl.allotrope.org/ontologies/result#
  ncit: http://purl.obolibrary.org/obo/
sources:
  staff-source:
    access: "staff.csv"
    referenceFormulation: "csv"
    iterator: "$"
mappings:

  staff_has_value:
    sources:
    - staff-source
    s: this:staff/$(id)
    po:
    - predicates: rdf:type
      objects:
        value: cbgp:researcher-identifier
        type: iri
    - predicates: sio:has-value
      objects:
        value: orcid:$(id)
        type: iri

  staff_person_details:
    sources:
    - staff-source
    s: this:staff/$(id)
    po:
    - predicates: rdf:type
      objects:
        value: foaf:Person
        type: iri
    - predicates: rdfs:label
      objects:
        value: $(name)
        type: literal  
    - predicates: foaf:mbox
      objects:
        value: mailto:$(email)
        type: iri  
    - predicates: foaf:homepage
      objects:
        value: $(homepage)
        type: iri  

  staff_affiliated_to_institution:
    sources:
    - staff-source
    s: this:staff/$(id)
    po:
    - predicates: ncit:Affiliated
      objects:
        value: this:staff/$(id)#affil_institution
        type: iri

  affil_institution_details:
    sources:
    - staff-source
    s: this:staff/$(id)#affil_institution
    po:
    - predicates: rdf:type
      objects:
        value: cbgp:Institution
        type: iri
    - predicates: rdfs:label
      objects:
        value: $(affil_institution_label)
        type: literal
    - predicates: sio:has-unique-identifier
      objects:
        value: ror:$(affil_institution_id)
        type: iri

