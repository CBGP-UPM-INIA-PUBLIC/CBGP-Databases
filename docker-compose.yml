services:
  graphdb:
    image: ontotext/graphdb:10.8.0
    restart: always
    hostname: graphdb
    ports:
      - 127.0.0.1:7200:7200
    volumes:
      - cbgp-graphdb:/opt/graphdb/home
    networks:
      - cbgp-default

      
volumes:
  cbgp-graphdb:
    external: true

networks:
  cbgp-default:
