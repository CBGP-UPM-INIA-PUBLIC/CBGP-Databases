services:
  graphdb:
    image: ontotext/graphdb:10.8.0
    restart: always
    hostname: graphdb
    ports:
      - 127.0.0.1:7200:7200
    volumes:
      - cbgp-graphdb:/opt/graphdb/home
    networks:
      - cbgp-default

  cbgp-databases:
    image: markw/cbgp-databases:0.10.0
    restart: always
    hostname: databases
    # Everything else (CBGP_SECRET, CBGP_USERS, NOTIFY_*, GRAPHDB_DBNAME,
    # GRAPHDB_HISTORY, HISTORY_USER/PASS, ...) comes from .env - see
    # configuration.md. GRAPHDB_HOST is overridden below because inside
    # Docker's network the app must reach GraphDB by its service hostname
    # (graphdb:7200), not whatever GRAPHDB_HOST says in .env (typically
    # localhost:7200, correct for running the app natively instead).
    env_file: .env
    environment:
      - GRAPHDB_HOST=graphdb:7200
    ports:
      - 127.0.0.1:8000:4567
    networks:
      - cbgp-default

      
volumes:
  cbgp-graphdb:
    external: true

networks:
  cbgp-default:
